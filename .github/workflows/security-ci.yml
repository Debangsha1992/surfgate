name: Security CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://surfgate:surfgate@127.0.0.1:5432/surfgate_test
      TEST_DATABASE_URL: postgresql://surfgate:surfgate@127.0.0.1:5432/surfgate_test
      REDIS_URL: redis://127.0.0.1:6379
      S3_REGION: auto
      S3_BUCKET: surfgate-test
      SURFGATE_RELAY_PUBLIC_URL: ws://127.0.0.1:8081
      SURFGATE_PROVIDER_SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SURFGATE_RELAY_TOKEN_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_USER: surfgate
          POSTGRES_PASSWORD: surfgate
          POSTGRES_DB: surfgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surfgate -d surfgate_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic release gate
        run: pnpm release:check

      - name: Run developer-safe capacity regression
        run: pnpm test:capacity

      - name: Build production service images
        run: |
          docker build -f apps/api/Dockerfile -t surfgate-api:${{ github.sha }} .
          docker build -f apps/relay/Dockerfile -t surfgate-relay:${{ github.sha }} .
          docker build -f apps/worker/Dockerfile -t surfgate-worker:${{ github.sha }} .

      - name: Verify production image identity and runtime payloads
        run: |
          test "$(docker image inspect surfgate-api:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect surfgate-relay:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect surfgate-worker:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint node surfgate-api:${{ github.sha }} -e "for (const f of ['dist/main.js','dist/database/migrate.js','dist/reconcile.js','migrations/0014-session-reconciliation-claim-index.sql']) if (!require('node:fs').existsSync(f)) process.exit(1)"
          docker run --rm --entrypoint node surfgate-relay:${{ github.sha }} -e "if (!require('node:fs').existsSync('dist/main.js')) process.exit(1)"
          docker run --rm --entrypoint node surfgate-worker:${{ github.sha }} -e "if (!require('node:fs').existsSync('dist/main.js')) process.exit(1)"

      - name: Verify least-privilege operational command configuration
        run: |
          docker run --rm --entrypoint node \
            -e NODE_ENV=production \
            -e 'DATABASE_URL=postgresql://migrator@database.surfgate.example/surfgate?sslmode=verify-full' \
            surfgate-api:${{ github.sha }} dist/database/migrate.js --validate-config
          docker run --rm --entrypoint node \
            -e NODE_ENV=production \
            -e 'DATABASE_URL=postgresql://reconciler@database.surfgate.example/surfgate?sslmode=verify-full' \
            -e CLOUDFLARE_ACCOUNT_ID=0123456789abcdef0123456789abcdef \
            -e CLOUDFLARE_BROWSER_RUN_API_TOKEN=synthetic-ci-provider-token \
            -e SURFGATE_PROVIDER_SESSION_ENCRYPTION_KEY=L2yYby+FsEILUGxBK+oZJdKcSCfUpjYgQfADBuTLOFw= \
            -e SURFGATE_PROVIDER_SESSION_ENCRYPTION_KEY_ID=provider-session-v1 \
            surfgate-api:${{ github.sha }} dist/reconcile.js --validate-config
