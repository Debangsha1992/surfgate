name: Feature request
description: Propose a focused SurfGate improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider support
        - Routing
        - Managed tasks
        - Relay
        - Security
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Include tenant, credential, network, retry/fallback, and provider-neutrality considerations.
    validations:
      required: true
