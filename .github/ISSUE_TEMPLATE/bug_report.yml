name: Bug report
description: Report reproducible unexpected SurfGate behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Remove API keys, tokens, cookies, URLs with credentials, page content, and raw CDP payloads before posting. Report vulnerabilities through SECURITY.md instead.'
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/pnpm versions, component, runtime/provider, and deployment mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Confirm secrets and browser/page data have been removed.
      render: text
